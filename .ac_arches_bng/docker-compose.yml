    arches-bng-0941b-livereload:
      profiles:
        - livereload
      container_name: arches-bng-0941b-livereload
      image: he/arches_bng-0941b:dev_build
      command: run_livereload
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-bng:/web_root/arches_bng
      env_file:
        - ./docker/env_file.env
      ports:
        - 35729:35729      
      depends_on:
          - arches-bng-0941b
      stdin_open: true
      tty: true
    
    arches-bng-0941b-webpack:
      container_name: arches-bng-0941b-webpack
      image: he/arches_bng-0941b:dev_build
      command: run_webpack
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-bng:/web_root/arches_bng
      env_file:
        - ./docker/env_file.env
      ports:
        - 8028:8021
      depends_on:
          - arches-bng-0941b
      stdin_open: true
      tty: true

networks:
  default:
    external: true
    name: arches-bng-0941b-network

volumes:
    arches-log-0941b:
    arches-static-0941b:
