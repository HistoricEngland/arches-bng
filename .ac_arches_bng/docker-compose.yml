
services:
    arches-bng-0941b:
      container_name: arches-bng-0941b
      image: he/arches_bng-0941b:dev_build
      build:
        args:
          - "PROJ_NAME=arches_bng"
          - "PROJ_REPO_NAME=arches-bng"
          - "DOCKER_PATH=./arches-bng/.ac_arches_bng/docker"
        context: ../..
        dockerfile: ./arches-bng/.ac_arches_bng/Dockerfile
        target: dev
      command: run_arches
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-bng:/web_root/arches_bng
        - ./docker:/web_root/docker
        - ../../arches-bng-package:/web_root/arches_bng_package
        - ../../arches-bng-data:/web_root/arches_bng_data
      env_file:
        - ./docker/env_file.env
      ports:
        - 8002:8000
        - 5678:5678
      stdin_open: true
      tty: true
    
