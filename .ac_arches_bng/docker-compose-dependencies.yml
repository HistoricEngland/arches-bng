
services:
    nginx-arches-bng-0941b:
      container_name: nginx-arches-bng-0941b
      image: nginx:latest
      ports:
        - "8080:80"
      volumes:
        - ./docker/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      networks:
        - arches-bng-0941b-network

    db-arches-bng-0941b:
      container_name: db-arches-bng-0941b
      image: postgis/postgis:14-3.2
      volumes:
        - postgres-data-0941b:/var/lib/postgresql/data
        - postgres-log-0941b:/var/log/postgresql
        - ./docker/init-unix.sql:/docker-entrypoint-initdb.d/init.sql # to set up the DB template
      ports:
        - '5433:5432'
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-bng-0941b-network

    elasticsearch-arches-bng-0941b:
      container_name: elasticsearch-arches-bng-0941b
      image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
      volumes:
        #- ../../elasticsearch_data_arches_bng:/usr/share/elasticsearch/data
        - elasticsearch-data-0941b:/usr/share/elasticsearch/data
      ports:
        - "9201:9200"
        - "9301:9300"
      env_file: 
        - ./docker/env_file.env
      networks:
        - arches-bng-0941b-network

    rabbitmq-arches-bng-0941b:
      container_name: rabbitmq-arches-bng-0941b
      image: rabbitmq:3.12.6-management
      hostname: my-rabbit
      volumes:
        - rabbitmq-data-0941b:/var/lib/rabbitmq/mnesia/rabbit@my-rabbit
        - rabbitmq-logs-0941b:/var/log/rabbitmq/log
      ports:
        - 5673:5672
        - 15673:15672
      networks:
        - arches-bng-0941b-network

