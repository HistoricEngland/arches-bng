networks:
  arches-bng-0941b-network:
    name: arches-bng-0941b-network
    driver: bridge

volumes:
    postgres-data-0941b:
    postgres-log-0941b:
    elasticsearch-data-0941b:
    rabbitmq-logs-0941b:
    rabbitmq-data-0941b:
