{% extends "views/components/widgets/base.htm" %}
{% load i18n %}

{% block form %}
<div class="row widget-wrapper">
    <div class="form-group">
        <p class="control-label widget-input-label" data-bind="text: label"></p>
        <div class="col-xs-12" style="margin-top:5px;">
            <label for="formatType"><strong><span data-bind="text: coordFormatLabel"></span></strong></label><br />
            <span data-bind="text: coordFormatDescription"></span>
            <select data-bind="options:coordOptions, value:coordFormat, optionsCaption:'Select A Format'"
                id="formatType"></select>


        </div>
        <div class="col-xs-12" style="margin-top:5px;">
            <label for="coordinatePoint"><strong><span data-bind="text: centralPointCoordinate"></span></strong><br /></label>
            <span data-bind="text: centralPointDescription"></span>
                <ul>
                    <li data-bind="text: alphanumericBNGExample"></li>
                    <li data-bind="text: absoluteBNGExample"></li>
                    <li data-bind="text: longLatExample"></li>
                </ul>
            <input type="text" data-bind="textInput: bngVal, hasFocus: isSelected, attr: {placeholder: placeholder}"
                class="form-control input-lg widget-input" style="margin-top:5px;margin-bottom: 5px"
                id="coordinatePoint">
        </div>

        <!--<div style="margin-top:5px;" data-bind="visible:messageVisible">-->
        <div class="col-xs-12" style="margin-top:5px;">
            <span data-bind="text: errorMessage" style="font-weight:bold;color:red;"></span>
        </div>

        <div class="col-xs-12" style="margin-top:5px;">
            <label class="control-label widget-input-label" for="previewPoint" data-bind="text: previewLabel"></label>
            <input disabled type="text" data-bind="textInput: preview" class="form-control input-lg widget-input"
                id="previewPoint">
        </div>
    </div>
</div>
{% endblock form %}

{% block config_form %}
<div class="control-label">
    {% trans "Placeholder" %}
</div>
<div class="col-xs-12 pad-no crud-widget-container">
    <input type="text" placeholder="{% trans "Placeholder" %}" aria-label="{% trans "Placeholder" %}" id=""
        class="form-control input-md widget-input" data-bind="textInput: placeholder">
</div>
{% endblock config_form %}

{% block report %}
<dt data-bind="text: label"></dt>
<dd>
    <div style='margin-bottom:2px' data-bind="text: value"></div>
</dd>
{% endblock report %}
